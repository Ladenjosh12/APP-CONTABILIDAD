databases:
  - name: contabilidad-db
    plan: free
    databaseName: contabilidad
    user: contabilidad

services:
  - type: web
    name: contabilidad-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contabilidad-db
          property: connectionString
      - key: TESSERACT_LANG
        value: spa
